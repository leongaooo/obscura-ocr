[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "obscura-ocr"
version = "0.1.0"
description = "Self-hosted OCR and evidence-based document field extraction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "pypdfium2==4.30.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
paddle = ["paddleocr==3.7.0", "paddlepaddle==3.3.1", "paddlex[ocr-core]==3.7.2"]
test = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.7"]

[project.scripts]
obscura-ocr = "obscura_ocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obscura_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
